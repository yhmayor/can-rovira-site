name: Refresh availability calendar

on:
  schedule:
    # Runs once a day at 05:00 UTC. Edit the cron expression to change the time.
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest availability
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        run: python scripts/refresh_availability.py

      - name: Commit updated availability data
        run: |
          git config user.name "availability-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data/availability.json; then
            git add data/availability.json
            git commit -m "Refresh availability data"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
